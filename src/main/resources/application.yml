spring:
  application:
    name: mood-playlist-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mood_playlist}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    issuer: ${JWT_ISSUER:mood-playlist}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:1209600}
    secret: ${JWT_SECRET:change-me}

external:
  codex:
    api-key: ${CODEX_API_KEY:}
    base-url: ${CODEX_BASE_URL:https://api.openai.com}
  oauth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    apple-client-id: ${APPLE_CLIENT_ID:}
    kakao-client-id: ${KAKAO_CLIENT_ID:}
